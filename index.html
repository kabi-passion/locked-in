<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#FAF5EC" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Locked In" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<title>Locked In</title>
<style>
  :root{
    --bg:#FAF5EC; --surface:#FFFFFF; --surface-2:#F4EDE0;
    --line:#EBE1D2;
    --text:#463D34; --text-soft:#95897A; --text-faint:#B7AC9C;
    --accent:#C97B5A; --accent-deep:#B3623F; --accent-soft:#F0D9CB;
    --sage:#7E9A82; --sage-soft:#E1EBE1;
    --amber:#D6A24A; --amber-soft:#F3E4C6;
    --gold:#C99A3F;
    --high:#C05C48; --high-soft:#F3D9D2;
    --med:#D6A24A; --med-soft:#F3E4C6;
    --low:#7E9A82; --low-soft:#E1EBE1;
    --shadow:0 6px 22px rgba(120,95,70,.10);
    --shadow-sm:0 2px 8px rgba(120,95,70,.08);
    --r:18px; --r-sm:12px;
    --serif:Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    font-size:16px; line-height:1.5; padding-bottom:86px;
    max-width:760px; margin:0 auto; position:relative; min-height:100vh;
  }
  h1,h2,h3{margin:0; font-weight:600;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,select,textarea{font-family:inherit; font-size:16px;}
  .app-pad{padding:6px 18px 8px;}
  .hidden{display:none !important;}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:18px 18px 8px;}
  .brand{font-family:var(--serif); font-size:23px; letter-spacing:.3px; display:flex; align-items:center; gap:9px;}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
  .top-right{display:flex; align-items:center; gap:8px;}
  .coinpill{display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:6px 12px 6px 8px; box-shadow:var(--shadow-sm); font-weight:700; font-size:15px;}
  .coin{width:19px;height:19px;border-radius:50%;background:linear-gradient(135deg,#E7C46A,#C99A3F);display:inline-flex;align-items:center;justify-content:center;color:#8a6a1f;font-size:11px;font-weight:800;flex:none;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4);}
  .greeting{font-family:var(--serif); font-size:22px; margin-top:2px;}
  .subtle{color:var(--text-soft); font-size:14px;}

  .card{background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow-sm); padding:18px; margin-bottom:14px; border:1px solid var(--line);}
  .card h2{font-size:13px; text-transform:uppercase; letter-spacing:1.3px; color:var(--text-soft); margin-bottom:12px; font-weight:600;}
  .card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .reorder-toggle{font-size:12.5px; font-weight:700; padding:6px 12px; border-radius:20px; background:var(--surface-2); color:var(--text-soft);}
  .reorder-toggle.on{background:var(--accent); color:#fff;}

  .rank-card{background:linear-gradient(135deg,#C97B5A,#B3623F); color:#fff; border:none;}
  .rank-card h2{color:rgba(255,255,255,.8);}
  .rank-top{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:12px;}
  .rank-title{font-family:var(--serif); font-size:24px; line-height:1.1;}
  .rank-pts{text-align:right;}
  .rank-pts .big{font-size:26px; font-weight:700;}
  .rank-pts .lbl{font-size:12px; opacity:.85;}
  .bar{height:10px; border-radius:20px; background:rgba(255,255,255,.28); overflow:hidden;}
  .bar > i{display:block; height:100%; background:#fff; border-radius:20px; transition:width .6s cubic-bezier(.2,.8,.2,1);}
  .rank-next{font-size:12.5px; opacity:.9; margin-top:8px;}

  .btn{background:var(--accent); color:#fff; padding:11px 16px; border-radius:12px; font-weight:600; font-size:15px; display:inline-flex; align-items:center; gap:7px; justify-content:center; transition:transform .08s, filter .15s;}
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:var(--surface-2); color:var(--text);}
  .btn.sage{background:var(--sage);}
  .btn.block{width:100%;}
  .btn.sm{padding:8px 12px; font-size:14px; border-radius:10px;}
  .btn:disabled{opacity:.45; cursor:default;}
  .icon-btn{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-soft);}

  .obt{display:flex; align-items:center; gap:12px;}
  .obt .star{flex:none;width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;}
  .obt-text{flex:1; font-size:17px; font-weight:600;}
  .obt-empty{color:var(--text-faint); font-weight:400; font-size:15px;}

  .concept-title{font-family:var(--serif); font-size:19px; margin-bottom:8px; color:var(--accent-deep);}
  .concept-body{font-size:15.5px; line-height:1.6;}

  .titem{border-bottom:1px solid var(--line);}
  .titem:last-child{border-bottom:none;}
  .task{display:flex; align-items:center; gap:12px; padding:12px 4px;}
  .subwrap{padding:2px 4px 12px 40px;}
  .subtask{display:flex; align-items:center; gap:10px; padding:7px 0;}
  .subcheck{flex:none; width:20px; height:20px; border-radius:6px; border:2px solid var(--text-faint); display:flex; align-items:center; justify-content:center; transition:all .16s;}
  .subcheck svg{opacity:0; transform:scale(.5); transition:all .16s;}
  .subtask.done .subcheck{background:var(--sage); border-color:var(--sage);}
  .subtask.done .subcheck svg{opacity:1; transform:scale(1);}
  .subtitle{flex:1; font-size:14px; word-break:break-word;}
  .subtask.done .subtitle{text-decoration:line-through; color:var(--text-faint);}
  .mini.sm2{width:26px; height:26px;}
  .subadd{display:flex; gap:8px; margin-top:8px;}
  .subadd input{flex:1; border:1px solid var(--line); border-radius:9px; padding:8px 10px; background:var(--surface-2); outline:none; font-size:14px;}
  .subadd input:focus{border-color:var(--accent); background:#fff;}
  .subempty{font-size:13px; color:var(--text-faint); padding:4px 0;}
  .subnote{font-size:11.5px; color:var(--text-faint); margin-top:8px; line-height:1.4;}
  .mini.openx{color:var(--accent);}
  .mini.openx svg{transform:rotate(180deg);}
  .reorder{display:flex; flex-direction:column; justify-content:center; gap:0; flex:none;}
  .rbtn{width:24px; height:16px; display:flex; align-items:center; justify-content:center; color:var(--text-soft); border-radius:5px;}
  .rbtn:active{background:var(--surface-2);}
  .rbtn:disabled{opacity:.22;}
  .subtask .reorder{margin-right:-2px;}
  .check{flex:none; width:26px; height:26px; border-radius:50%; border:2px solid var(--text-faint); display:flex; align-items:center; justify-content:center; transition:all .18s;}
  .check svg{opacity:0; transform:scale(.4); transition:all .18s;}
  .task.done .check{background:var(--sage); border-color:var(--sage);}
  .task.done .check svg{opacity:1; transform:scale(1);}
  .task-body{flex:1; min-width:0;}
  .task-title{font-size:15.5px; font-weight:500; word-break:break-word;}
  .task.done .task-title{text-decoration:line-through; color:var(--text-faint);}
  .task-meta{display:flex; align-items:center; gap:8px; margin-top:3px;}
  .pill{font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; letter-spacing:.3px; text-transform:uppercase;}
  .pill.high{background:var(--high-soft); color:var(--high);}
  .pill.med{background:var(--med-soft); color:#B5842E;}
  .pill.low{background:var(--low-soft); color:var(--sage);}
  .pts-tag{font-size:12px; color:var(--text-soft); display:inline-flex; align-items:center; gap:4px;}
  .task-actions{display:flex; gap:4px; flex:none;}
  .mini{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text-faint);background:transparent;}
  .mini:active{background:var(--surface-2);}
  .empty{text-align:center; color:var(--text-faint); padding:22px 10px; font-size:14.5px;}

  .field-lbl{font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--text-faint); font-weight:700; margin:14px 0 0 2px;}
  .prio-select{display:flex; gap:6px; margin:8px 0 4px;}
  .cat-chip{flex:1; text-align:center; padding:9px 4px; border-radius:11px; font-size:13px; font-weight:600; border:2px solid transparent; background:var(--surface-2); color:var(--text-soft); transition:all .15s;}
  .cat-chip.cat-school.on{background:#DCE7EC; color:#5B7E90; border-color:#6C8EA0;}
  .cat-chip.cat-work.on{background:var(--med-soft); color:#B5842E; border-color:var(--med);}
  .cat-chip.cat-personal.on{background:var(--sage-soft); color:var(--sage); border-color:var(--sage);}
  .cat-tag{font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; letter-spacing:.3px;}
  .cat-tag.cat-school{background:#DCE7EC; color:#5B7E90;}
  .cat-tag.cat-work{background:var(--med-soft); color:#B5842E;}
  .cat-tag.cat-personal{background:var(--sage-soft); color:var(--sage);}
  .prio-chip{flex:1; text-align:center; padding:9px 4px; border-radius:11px; font-size:13px; font-weight:600; border:2px solid transparent; background:var(--surface-2); color:var(--text-soft); transition:all .15s;}
  .prio-chip[data-p=high].on{background:var(--high-soft); color:var(--high); border-color:var(--high);}
  .prio-chip[data-p=med].on{background:var(--med-soft); color:#B5842E; border-color:var(--med);}
  .prio-chip[data-p=low].on{background:var(--low-soft); color:var(--sage); border-color:var(--sage);}

  .timer-wrap{text-align:center;}
  .timer-ring{position:relative; width:190px; height:190px; margin:6px auto 14px;}
  .timer-ring svg{transform:rotate(-90deg);}
  .timer-time{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .timer-time .t{font-size:42px; font-weight:700; font-variant-numeric:tabular-nums; font-family:var(--serif);}
  .timer-time .mode{font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-soft); margin-top:2px;}
  .timer-controls{display:flex; gap:10px; justify-content:center;}
  .focus-label{width:100%; text-align:center; border:none; border-bottom:1.5px dashed var(--line); padding:8px; margin-bottom:12px; background:transparent; outline:none; font-size:15px;}
  .focus-label:focus{border-color:var(--accent);}

  /* Calendar */
  .cal-toggle{display:flex; gap:6px; background:var(--surface-2); border-radius:12px; padding:4px; margin-bottom:14px;}
  .cal-toggle button{flex:1; padding:8px; border-radius:9px; font-weight:600; font-size:14px; color:var(--text-soft);}
  .cal-toggle button.on{background:var(--surface); color:var(--accent); box-shadow:var(--shadow-sm);}
  .cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .cal-nav .lbl{font-family:var(--serif); font-size:18px;}
  .cal-nav button{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-soft);}
  .weekstrip{display:flex; gap:6px; justify-content:space-between; margin-bottom:14px;}
  .day-cell{flex:1; text-align:center; padding:9px 2px; border-radius:13px; background:var(--surface); border:1px solid var(--line); transition:all .15s;}
  .day-cell .dow{font-size:11px; color:var(--text-soft); text-transform:uppercase; letter-spacing:.5px;}
  .day-cell .num{font-size:17px; font-weight:600; margin-top:3px;}
  .day-cell.sel{background:var(--accent); border-color:var(--accent); color:#fff;}
  .day-cell.sel .dow{color:rgba(255,255,255,.85);}
  .day-cell.today .num{color:var(--accent);}
  .day-cell.sel.today .num{color:#fff;}
  .day-cell .hasdot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin:4px auto 0;}
  .day-cell.sel .hasdot{background:#fff;}
  .timeline{position:relative; margin-top:6px;}
  .hourrow{display:flex; align-items:flex-start; height:52px; position:relative;}
  .hourlbl{width:52px; flex:none; font-size:12px; color:var(--text-faint); transform:translateY(-7px);}
  .hourline{flex:1; border-top:1px solid var(--line); height:0;}
  .blocks-layer{position:absolute; left:52px; right:0; top:0; bottom:0;}
  .tblock{position:absolute; left:2px; right:2px; border-radius:10px; padding:6px 10px; font-size:13px; color:#fff; overflow:hidden; box-shadow:var(--shadow-sm);}
  .tblock .bt{font-weight:600; font-size:13.5px; line-height:1.25;}
  .tblock .bti{font-size:11.5px; opacity:.9;}
  .tblock .bx{position:absolute; top:4px; right:6px; opacity:.85; font-size:15px;}
  .monthgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
  .monthgrid .mh{text-align:center; font-size:11px; color:var(--text-faint); padding-bottom:4px;}
  .mcell{aspect-ratio:1; border-radius:10px; background:var(--surface); border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:14px; position:relative;}
  .mcell.other{background:transparent; border-color:transparent; color:var(--text-faint); opacity:.5;}
  .mcell.today{border-color:var(--accent);}
  .mcell.sel{background:var(--accent); color:#fff; border-color:var(--accent);}
  .mcell .mdot{width:5px;height:5px;border-radius:50%;background:var(--accent);}
  .mcell.sel .mdot{background:#fff;}

  /* Gym */
  .streak-hero{text-align:center; padding:6px 0 4px;}
  .streak-num{font-family:var(--serif); font-size:58px; font-weight:700; color:var(--accent); line-height:1;}
  .streak-lbl{color:var(--text-soft); font-size:14px; margin-top:2px;}
  .heat{display:grid; grid-template-columns:repeat(7,1fr); gap:7px; margin-top:6px;}
  .heat .hd{font-size:11px; text-align:center; color:var(--text-faint);}
  .heat .cell{aspect-ratio:1; border-radius:8px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--text-faint);}
  .heat .cell.on{background:var(--sage); color:#fff; font-weight:600;}
  .heat .cell.today-c{box-shadow:0 0 0 2px var(--accent);}
  .heat .cell.blank{background:transparent;}
  /* Gym month calendar */
  .gm-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .gm-h{text-align:center; font-size:10px; color:var(--text-faint); padding-bottom:2px;}
  .gm-cell{min-height:56px; border-radius:9px; background:var(--surface-2); border:1px solid transparent; padding:4px 3px; display:flex; flex-direction:column; align-items:center; gap:2px; overflow:hidden;}
  .gm-cell.blank{background:transparent;}
  .gm-cell.on{background:var(--sage-soft); border-color:var(--sage);}
  .gm-cell.today{box-shadow:0 0 0 2px var(--accent);}
  .gm-num{font-size:12px; color:var(--text-soft); font-weight:600;}
  .gm-cell.on .gm-num{color:var(--sage);}
  .gm-tags{display:flex; flex-wrap:wrap; gap:2px; justify-content:center;}
  .gtag{font-size:8.5px; font-weight:700; background:var(--sage); color:#fff; padding:1px 3px; border-radius:4px; line-height:1.3;}

  /* Garden */
  .garden-scene{background:linear-gradient(180deg,#EFE0CB 0%,#EAD6B8 55%,#DCC49E 100%); border-radius:var(--r); border:1px solid var(--line); padding:16px; min-height:180px; display:flex; flex-wrap:wrap; align-content:flex-end; gap:10px 6px; position:relative; overflow:hidden; margin-bottom:6px;}
  .garden-scene::after{content:''; position:absolute; left:0; right:0; bottom:0; height:34%; background:linear-gradient(180deg,rgba(150,120,80,0),rgba(120,95,60,.18));}
  .g-item{font-size:40px; line-height:1; filter:drop-shadow(0 3px 4px rgba(90,70,45,.25)); position:relative; z-index:1; animation:sprout .5s cubic-bezier(.2,1.3,.4,1);}
  @keyframes sprout{0%{transform:translateY(10px) scale(.4); opacity:0;}100%{transform:translateY(0) scale(1); opacity:1;}}
  .garden-empty{width:100%; text-align:center; color:#8a7355; font-size:14.5px; align-self:center; padding:30px 0;}
  .collect-meter{display:flex; align-items:center; gap:10px; margin:2px 0 16px; font-size:13px; color:var(--text-soft);}
  .collect-meter .bar{flex:1;}
  .collect-meter .bar > i{background:var(--sage);}
  .shop-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .shop-item{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); padding:14px 12px; text-align:center; position:relative;}
  .shop-item .emoji{font-size:38px; line-height:1; margin:2px 0 8px;}
  .shop-item .nm{font-size:14px; font-weight:600; margin-bottom:3px;}
  .rar{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; padding:2px 8px; border-radius:20px; display:inline-block; margin-bottom:9px;}
  .rar.common{background:var(--sage-soft); color:var(--sage);}
  .rar.uncommon{background:#DDECDD; color:#5E8062;}
  .rar.rare{background:#DCE7EC; color:#5B7E90;}
  .rar.epic{background:var(--accent-soft); color:var(--accent-deep);}
  .rar.legendary{background:#F3E6C4; color:#A9812C;}
  .shop-item .price{display:inline-flex; align-items:center; gap:5px; font-weight:700; font-size:14px; justify-content:center; margin-bottom:9px;}
  .buy-btn{width:100%; padding:8px; border-radius:10px; font-weight:700; font-size:13px; background:var(--accent); color:#fff;}
  .buy-btn.owned{background:var(--sage-soft); color:var(--sage);}
  .buy-btn.cant{background:var(--surface-2); color:var(--text-faint);}
  .buy-btn.locked{background:var(--surface-2); color:var(--text-faint);}
  .shop-item.ownedcard{border-color:var(--sage); background:linear-gradient(180deg,#fff,#F6FAF6);}
  .shop-item.next{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft);}
  .shop-item.locked{opacity:.5;}
  .shop-item.locked .emoji{filter:grayscale(.7);}
  .muscle-tag{flex:none; font-size:12px; font-weight:700; color:var(--sage); background:var(--sage-soft); padding:4px 11px; border-radius:20px;}
  .mchips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  .mchip{padding:10px 15px; border-radius:22px; background:var(--surface-2); color:var(--text); font-weight:600; font-size:14px; border:2px solid transparent;}
  .mchip.on{background:var(--sage-soft); color:var(--sage); border-color:var(--sage);}

  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); padding:14px;}
  .stat .n{font-size:26px; font-weight:700; font-family:var(--serif); color:var(--accent);}
  .stat .l{font-size:12.5px; color:var(--text-soft); margin-top:2px;}
  .barchart{display:flex; align-items:flex-end; gap:8px; height:110px; margin-top:8px;}
  .barchart .col{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end;}
  .barchart .bar-v{width:70%; background:var(--accent-soft); border-radius:6px 6px 0 0; min-height:3px; transition:height .5s;}
  .barchart .bar-v.has{background:var(--accent);}
  .barchart .cl{font-size:11px; color:var(--text-faint);}

  .nav{position:fixed; bottom:0; left:0; right:0; max-width:760px; margin:0 auto; background:rgba(255,255,255,.93); backdrop-filter:blur(10px); border-top:1px solid var(--line); display:flex; padding:8px 0 calc(8px + env(safe-area-inset-bottom)); z-index:50;}
  .nav button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-faint); font-size:9.5px; font-weight:600; padding:4px 0;}
  .nav button svg{width:21px;height:21px;}
  .nav button.on{color:var(--accent);}

  .overlay{position:fixed; inset:0; background:rgba(70,55,45,.42); display:flex; align-items:flex-end; justify-content:center; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s;}
  .overlay.show{opacity:1; pointer-events:auto;}
  .sheet{background:var(--surface); width:100%; max-width:760px; border-radius:22px 22px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom)); transform:translateY(30px); transition:transform .25s cubic-bezier(.2,.8,.2,1);}

  .confetti-piece{position:fixed; z-index:199; width:9px; height:9px; pointer-events:none; border-radius:2px;}
  .toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--text); color:#fff; padding:11px 18px; border-radius:14px; font-size:14px; font-weight:500; z-index:210; opacity:0; pointer-events:none; transition:all .3s; box-shadow:var(--shadow); text-align:center; max-width:90%;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>

  </button>

<script>
/* ============================================================
   Locked In — personal productivity app (v2)
   Local-first. All state lives in one object saved to
   localStorage. To add cross-device sync later, replace
   Store.save/Store.load with backend calls — everything else
   reads & writes through here.

   Currency model:
     coins.earned = lifetime coins (drives RANK, never drops for spending)
     coins.spent  = coins spent in the garden shop
     balance      = earned - spent  (what you can spend)
   ============================================================ */

const PRIORITY = {
  high: { label:'High',   points:25, cls:'high' },
  med:  { label:'Medium', points:15, cls:'med'  },
  low:  { label:'Low',    points:5,  cls:'low'  },
};
const FOCUS_BONUS = 10;
const GYM_POINTS  = 20;
const CATEGORIES = { School:'school', Work:'work', Personal:'personal' };

/* Zen Garden — sequential unlock, every plant costs the same.
   36 plants x 800 = 28,800 coins to complete ≈ a year of steady consistency. */
const PLANT_PRICE = 800;
const RAR = { common:{label:'Common'}, uncommon:{label:'Uncommon'}, rare:{label:'Rare'}, epic:{label:'Epic'}, legendary:{label:'Legendary'} };
const GARDEN = [
  {id:'sprout',    nm:'Sprout',         e:'🌱', r:'common'},
  {id:'herb',      nm:'Herb',           e:'🌿', r:'common'},
  {id:'shamrock',  nm:'Shamrock',       e:'☘️', r:'common'},
  {id:'clover',    nm:'Lucky Clover',   e:'🍀', r:'common'},
  {id:'leaves',    nm:'Fresh Leaves',   e:'🍃', r:'common'},
  {id:'grass',     nm:'Grass Tuft',     e:'🌾', r:'common'},
  {id:'potted',    nm:'Potted Plant',   e:'🪴', r:'common'},
  {id:'cactus',    nm:'Cactus',         e:'🌵', r:'common'},
  {id:'daisy',     nm:'Daisy',          e:'🌼', r:'uncommon'},
  {id:'tulip',     nm:'Tulip',          e:'🌷', r:'uncommon'},
  {id:'sunflower', nm:'Sunflower',      e:'🌻', r:'uncommon'},
  {id:'rose',      nm:'Rose',           e:'🌹', r:'uncommon'},
  {id:'rosette',   nm:'Rosette',        e:'🏵️', r:'uncommon'},
  {id:'bouquet',   nm:'Bouquet',        e:'💐', r:'uncommon'},
  {id:'autumn',    nm:'Autumn Leaf',    e:'🍂', r:'uncommon'},
  {id:'maple',     nm:'Maple Leaf',     e:'🍁', r:'uncommon'},
  {id:'bamboo',    nm:'Bamboo',         e:'🎋', r:'rare'},
  {id:'blossom',   nm:'Cherry Blossom', e:'🌸', r:'rare'},
  {id:'lotus',     nm:'Lotus',          e:'🪷', r:'rare'},
  {id:'mushroom',  nm:'Mushroom',       e:'🍄', r:'rare'},
  {id:'chestnut',  nm:'Chestnut',       e:'🌰', r:'rare'},
  {id:'stone',     nm:'Zen Stone',      e:'🪨', r:'rare'},
  {id:'lantern',   nm:'Stone Lantern',  e:'🏮', r:'rare'},
  {id:'nest',      nm:"Bird's Nest",    e:'🪺', r:'rare'},
  {id:'evergreen', nm:'Bonsai Pine',    e:'🌲', r:'epic'},
  {id:'oak',       nm:'Oak Tree',       e:'🌳', r:'epic'},
  {id:'palm',      nm:'Palm Tree',      e:'🌴', r:'epic'},
  {id:'koi',       nm:'Koi Fish',       e:'🐟', r:'epic'},
  {id:'butterfly', nm:'Butterfly',      e:'🦋', r:'epic'},
  {id:'bee',       nm:'Honeybee',       e:'🐝', r:'epic'},
  {id:'torii',     nm:'Torii Gate',     e:'⛩️', r:'epic'},
  {id:'pagoda',    nm:'Pagoda',         e:'🏯', r:'legendary'},
  {id:'moon',      nm:'Harvest Moon',   e:'🌕', r:'legendary'},
  {id:'swan',      nm:'White Swan',     e:'🦢', r:'legendary'},
  {id:'peacock',   nm:'Peacock',        e:'🦚', r:'legendary'},
  {id:'fuji',      nm:'Mount Fuji',     e:'🗻', r:'legendary'},
  /* >>> TO ADD MORE PLANTS: append new lines here, at the END of this list.
     Each needs a UNIQUE id, a name (nm), an emoji (e), and a rarity (r:
     common | uncommon | rare | epic | legendary). They automatically join
     the path after Mount Fuji, cost the same PLANT_PRICE, and unlock next.
     Only append at the end — don't reorder or delete existing plants, or
     saved progress could shift. Example:
     {id:'waterfall', nm:'Waterfall', e:'⛲', r:'legendary'},
  <<< */
];
const MUSCLES = ['Chest','Back','Biceps','Triceps','Shoulders','Legs','Core','Cardio','Soccer','Basketball'];
const ABBR = {Chest:'Che',Back:'Bck',Biceps:'Bi',Triceps:'Tri',Shoulders:'Sho',Legs:'Leg',Core:'Cor',Cardio:'Car',Soccer:'Soc',Basketball:'Bkb'};

/* ---------- Store ---------- */
const KEY = 'lockedin.v2';   // fresh key → starts empty, ignores old demo/test data
const Store = {
  load(){ try{ const raw=localStorage.getItem(KEY); if(raw) return normalize(JSON.parse(raw)); }catch(e){ console.warn('load failed',e);} return null; },
  save(){ try{ state._ts=Date.now(); localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ console.warn('save failed (storage may be blocked in preview)',e);} if(!applyingRemote) pushDebounced(); }
};
function normalize(s){
  s = s || {};
  if(!s.coins){ s.coins = { earned: (typeof s.points==='number'? s.points : 0), spent: 0 }; }
  if(typeof s.coins.earned!=='number') s.coins.earned=0;
  if(typeof s.coins.spent!=='number') s.coins.spent=0;
  s.tasks = s.tasks||[]; s.blocks = s.blocks||[]; s.gym = s.gym||{};
  s.tasks.forEach(t=>{ if(!Array.isArray(t.subtasks)) t.subtasks=[]; if(!t.category) t.category='Personal'; });
  // gym values are now ARRAYS of muscle groups; migrate booleans / single strings
  Object.keys(s.gym).forEach(k=>{ const v=s.gym[k];
    if(v===true) s.gym[k]=['Workout'];
    else if(typeof v==='string') s.gym[k]=[v];
    else if(!Array.isArray(v)) delete s.gym[k];
    else if(v.length===0) delete s.gym[k];
  });
  // garden owns are sequential; drop any ids not in the current plant list, keep order
  s.garden = (s.garden||[]).filter(id=>GARDEN.some(g=>g.id===id));
  if(typeof s.focusSessions!=='number') s.focusSessions=0;
  if(!s.focusSettings || typeof s.focusSettings.work!=='number') s.focusSettings={work:25,brk:5};
  if(typeof s.focusSettings.brk!=='number') s.focusSettings.brk=5;
  if(typeof s.oneBigThing!=='string') s.oneBigThing='';
  return s;
}
function balance(){ return Math.max(0, state.coins.earned - state.coins.spent); }

function defaultState(){
  return { coins:{earned:0,spent:0}, oneBigThing:'', tasks:[], blocks:[], gym:{}, garden:[], focusSessions:0, focusSettings:{work:25,brk:5}, createdAt:todayKey() };
}

/* ---------- Date helpers ---------- */
function todayKey(d){ d=d||new Date(); const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function fromKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function sameDay(a,b){ return todayKey(a)===todayKey(b); }
function dayOfYear(d){ d=d||new Date(); const start=new Date(d.getFullYear(),0,0); return Math.floor((d-start)/86400000); }
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];

/* ---------- Demo seed ---------- */
function seedDemo(){
  const s=defaultState(); const tk=todayKey();
  s.oneBigThing='Sketch the first three screens of Locked In';
  s.tasks=[
    {id:uid(),title:'Finish history essay outline',prio:'high',done:false,created:Date.now()},
    {id:uid(),title:'Reply to emails',prio:'low',done:false,created:Date.now()},
    {id:uid(),title:'Read one chapter of Deep Work',prio:'med',done:false,created:Date.now()},
    {id:uid(),title:'Tidy desk',prio:'low',done:true,created:Date.now()-8e6,doneAt:Date.now()-8e6},
  ];
  // Demo: first 3 plants already grown, ~900 coins spare to try the next purchase
  s.garden=['sprout','herb','shamrock'];
  s.coins={earned:3*PLANT_PRICE+900, spent:3*PLANT_PRICE};
  s.blocks=[
    {id:uid(),title:'Deep work block',day:tk,start:9*60,end:10*60+30,taskId:null},
    {id:uid(),title:'Gym',day:tk,start:17*60,end:18*60,taskId:null},
  ];
  s.gym[todayKey(addDays(new Date(),-1))]=['Chest','Triceps'];
  s.gym[todayKey(addDays(new Date(),-2))]=['Legs','Core'];
  return s;
}
function uid(){ return Math.random().toString(36).slice(2,10); }

// Start completely empty: 0 coins, no plants, no tasks, no gym logs.
let state = Store.load() || defaultState();

/* ---------- Garden-based rank ---------- */
function ownedCount(){ return state.garden.length; }
function latestPlant(){ const n=ownedCount(); return n>0?GARDEN[n-1]:null; }
function nextPlant(){ const n=ownedCount(); return n<GARDEN.length?GARDEN[n]:null; }

/* ---------- Coins + celebration ---------- */
function award(points,x,y){
  state.coins.earned+=points; Store.save(); syncCoinBar();
  if(x!=null) pointsPop('+'+points,x,y);
}
function syncCoinBar(){ const el=document.getElementById('coinBal'); if(el) el.textContent=balance(); }
function pointsPop(txt,x,y){ const el=document.createElement('div'); el.className='pop'; el.textContent=txt; el.style.left=(x-14)+'px'; el.style.top=(y-24)+'px'; document.body.appendChild(el); setTimeout(()=>el.remove(),1000); }
function confetti(){
  const colors=['#C97B5A','#7E9A82','#D6A24A','#B3623F','#E8C9B8','#C99A3F'];
  for(let i=0;i<28;i++){ const p=document.createElement('div'); p.className='confetti-piece'; p.style.background=colors[i%colors.length];
    p.style.left=(window.innerWidth/2)+'px'; p.style.top=(window.innerHeight/2)+'px'; document.body.appendChild(p);
    const ang=Math.random()*Math.PI*2,dist=90+Math.random()*160,dx=Math.cos(ang)*dist,dy=Math.sin(ang)*dist-40;
    p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx}px,${dy+220}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:1100+Math.random()*500,easing:'cubic-bezier(.2,.6,.4,1)'});
    setTimeout(()=>p.remove(),1650);
  }
}
let toastT; function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2300); }

/* ---------- Navigation ---------- */
let currentTab='today', selectedDay=todayKey(), calView='week', monthAnchor=todayKey();
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
function setTab(tab){ currentTab=tab; document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab)); render(); window.scrollTo(0,0); }

function render(){
  const v=document.getElementById('view');
  if(currentTab==='today') v.innerHTML=viewToday();
  else if(currentTab==='tasks') v.innerHTML=viewTasks();
  else if(currentTab==='calendar') v.innerHTML=viewCalendar();
  else if(currentTab==='gym') v.innerHTML=viewGym();
  else if(currentTab==='focus') v.innerHTML=viewFocus();
  else if(currentTab==='garden') v.innerHTML=viewGarden();
  else if(currentTab==='stats') v.innerHTML=viewStats();
  syncCoinBar(); wire();
}

/* ---------- Shared ---------- */
function coinIco(){ return '<span class="coin">K</span>'; }
function rankBarHTML(){
  const owned=ownedCount(), latest=latestPlant(), next=nextPlant(), bal=balance();
  const rankName = latest?`${latest.e} ${latest.nm}`:'🧑‍🌾 New Gardener';
  const rarLbl = latest?RAR[latest.r].label:'Plant your first to earn a rank';
  let pct, sub;
  if(next){
    pct=Math.min(100,Math.round(bal/PLANT_PRICE*100));
    const need=Math.max(0,PLANT_PRICE-bal);
    sub = need>0 ? `${need} coins to unlock ${next.nm} ${next.e}` : `Ready to plant ${next.nm} ${next.e} — visit the Garden`;
  } else { pct=100; sub='Garden complete — you are a Garden Master 🗻'; }
  return `<div class="card rank-card">
    <div class="rank-top">
      <div><h2>Your Rank</h2><div class="rank-title">${rankName}</div><div style="font-size:12px;opacity:.85;margin-top:3px">${rarLbl}${latest?' · '+owned+'/'+GARDEN.length+' planted':''}</div></div>
      <div class="rank-pts"><div class="big">${bal}</div><div class="lbl">coins to spend</div></div>
    </div>
    <div class="bar"><i style="width:${Math.max(4,pct)}%"></i></div>
    <div class="rank-next">${sub}</div></div>`;
}
const SVG_EDIT='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18.5 9.5l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>';
const SVG_UP='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>';
const SVG_DOWN='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function reorderCtl(act,attrs,canUp,canDown){
  return `<div class="reorder"><button class="rbtn" data-act="${act}" ${attrs} data-dir="up" ${canUp?'':'disabled'} aria-label="Move up">${SVG_UP}</button><button class="rbtn" data-act="${act}" ${attrs} data-dir="down" ${canDown?'':'disabled'} aria-label="Move down">${SVG_DOWN}</button></div>`;
}
const SVG_TRASH='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>';
function taskHTML(t){ const p=PRIORITY[t.prio]; const cat=t.category||'Personal'; const cc=CATEGORIES[cat]||'personal';
  const subs=t.subtasks||[]; const doneS=subs.filter(s=>s.done).length; const showAdd=expandedTasks.has(t.id);
  const subProgress = subs.length?`<span class="pts-tag">☑ ${doneS}/${subs.length}</span>`:'';
  const openList=state.tasks.filter(x=>!x.done); const oi=openList.findIndex(x=>x.id===t.id);
  const reorder = (t.done||!reorderMode) ? '' : reorderCtl('moveTask', `data-id="${t.id}"`, oi>0, oi>=0&&oi<openList.length-1);
  const row = `<div class="task ${t.done?'done':''}" data-id="${t.id}">
    <button class="check" data-act="toggle" data-id="${t.id}" aria-label="Complete"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></button>
    <div class="task-body"><div class="task-title">${esc(t.title)}</div>
      <div class="task-meta"><span class="cat-tag cat-${cc}">${cat}</span><span class="pill ${p.cls}">${p.label}</span><span class="pts-tag">${coinIco()} ${p.points}</span>${subProgress}</div></div>
    <div class="task-actions">
      <button class="mini ${showAdd?'openx':''}" data-act="expand" data-id="${t.id}" aria-label="Add subtask"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="mini" data-act="editTask" data-id="${t.id}" aria-label="Edit">${SVG_EDIT}</button>
      <button class="mini" data-act="schedule" data-id="${t.id}" aria-label="Schedule"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></button>
      <button class="mini" data-act="del" data-id="${t.id}" aria-label="Delete">${SVG_TRASH}</button>
      ${reorder}
    </div></div>`;
  const listHTML = subs.map((s,si)=>`<div class="subtask ${s.done?'done':''}">
      <button class="subcheck" data-act="toggleSub" data-id="${t.id}" data-sub="${s.id}" aria-label="Done"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></button>
      <div class="subtitle">${esc(s.title)}</div>
      <button class="mini sm2" data-act="editSub" data-id="${t.id}" data-sub="${s.id}" aria-label="Edit">${SVG_EDIT}</button>
      <button class="mini sm2" data-act="scheduleSub" data-id="${t.id}" data-sub="${s.id}" aria-label="Schedule"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></button>
      <button class="mini sm2" data-act="delSub" data-id="${t.id}" data-sub="${s.id}" aria-label="Delete">${SVG_TRASH}</button>
      ${reorderMode?reorderCtl('moveSub', `data-id="${t.id}" data-sub="${s.id}"`, si>0, si<subs.length-1):''}
    </div>`).join('');
  const addHTML = showAdd ? `<div class="subadd"><input id="subin-${t.id}" type="text" placeholder="Add a subtask…" /><button class="btn sm" data-act="addSub" data-id="${t.id}">Add</button></div>` : '';
  let subBlock='';
  if(subs.length || showAdd){ subBlock=`<div class="subwrap">${listHTML}${addHTML}</div>`; }
  return `<div class="titem">${row}${subBlock}</div>`;
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(min){ let h=Math.floor(min/60),m=min%60; const ap=h>=12?'PM':'AM'; let hh=h%12; if(hh===0)hh=12; return `${hh}:${String(m).padStart(2,'0')} ${ap}`; }

/* ---------- CALENDAR ---------- */
function weekAround(dayKey){ const d=fromKey(dayKey),dow=d.getDay(),sun=addDays(d,-dow); return Array.from({length:7},(_,i)=>todayKey(addDays(sun,i))); }
function viewCalendar(){
  return `<div class="app-pad">
    <div class="greeting">Calendar</div>
    <div class="subtle">Plan your time, then work the blocks.</div>
    <div style="height:14px"></div>
    <div class="cal-toggle">
      <button class="${calView==='week'?'on':''}" data-act="calWeek">Week</button>
      <button class="${calView==='month'?'on':''}" data-act="calMonth">Month</button>
    </div>
    ${calView==='week'?weekView():monthView()}
  </div>`;
}
function weekView(){
  const week=weekAround(selectedDay), tk=todayKey(), sd=fromKey(selectedDay);
  const dcells=week.map(k=>{ const d=fromKey(k),has=state.blocks.some(b=>b.day===k);
    return `<button class="day-cell ${k===selectedDay?'sel':''} ${k===tk?'today':''}" data-act="pickday" data-day="${k}"><div class="dow">${DOW[d.getDay()]}</div><div class="num">${d.getDate()}</div>${has?'<div class="hasdot"></div>':'<div style="height:9px"></div>'}</button>`; }).join('');
  const startH=6,endH=23,pxPerMin=52/60; let rows='';
  for(let h=startH;h<=endH;h++) rows+=`<div class="hourrow"><div class="hourlbl">${fmtTime(h*60)}</div><div class="hourline"></div></div>`;
  const dayBlocks=state.blocks.filter(b=>b.day===selectedDay);
  const blocksHTML=dayBlocks.map(b=>{ const top=(b.start-startH*60)*pxPerMin,height=Math.max(24,(b.end-b.start)*pxPerMin);
    const linked=b.taskId&&state.tasks.find(t=>t.id===b.taskId); const bg=linked?`var(--${linked.prio})`:'var(--accent)';
    return `<div class="tblock" style="top:${top}px;height:${height}px;background:${bg}"><button class="bx" data-act="delblock" data-id="${b.id}" aria-label="Delete">×</button><div class="bt">${esc(b.title)}</div><div class="bti">${fmtTime(b.start)} – ${fmtTime(b.end)}</div></div>`; }).join('');
  return `<div class="cal-nav"><button data-act="prevWeek" aria-label="Previous week"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="lbl">${MON[sd.getMonth()].slice(0,3)} ${sd.getDate()}, ${sd.getFullYear()}</div>
      <button data-act="nextWeek" aria-label="Next week"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button></div>
    <div class="weekstrip">${dcells}</div>
    <button class="btn block sage" data-act="addBlock" style="margin-bottom:14px">+ Add time block</button>
    <div class="card" style="padding:14px 14px 20px"><div class="timeline">${rows}<div class="blocks-layer">${blocksHTML}</div></div></div>`;
}
function monthView(){
  const anc=fromKey(monthAnchor), y=anc.getFullYear(), m=anc.getMonth(), tk=todayKey();
  const first=new Date(y,m,1), startPad=first.getDay(), dim=new Date(y,m+1,0).getDate();
  const cells=[];
  for(let i=0;i<startPad;i++) cells.push(null);
  for(let d=1;d<=dim;d++) cells.push(new Date(y,m,d));
  while(cells.length%7!==0) cells.push(null);
  const grid=DOW.map(d=>`<div class="mh">${d[0]}</div>`).join('')+cells.map(d=>{
    if(!d) return '<div class="mcell other"></div>';
    const k=todayKey(d), has=state.blocks.some(b=>b.day===k);
    return `<button class="mcell ${k===tk?'today':''} ${k===selectedDay?'sel':''}" data-act="pickmonthday" data-day="${k}"><span>${d.getDate()}</span>${has?'<span class="mdot"></span>':''}</button>`;
  }).join('');
  return `<div class="cal-nav"><button data-act="prevMonth" aria-label="Previous month"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="lbl">${MON[m]} ${y}</div>
      <button data-act="nextMonth" aria-label="Next month"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button></div>
    <div class="card"><div class="monthgrid">${grid}</div></div>
    <div class="subtle" style="text-align:center;margin-top:-4px">Tap a day to open its schedule</div>`;
}

/* ---------- GYM ---------- */
function gymStreak(){ let streak=0,d=new Date(); if(!state.gym[todayKey(d)]) d=addDays(d,-1); while(state.gym[todayKey(d)]){ streak++; d=addDays(d,-1);} return streak; }
function gymLongest(){ const keys=Object.keys(state.gym).filter(k=>state.gym[k]).sort(); let best=0,run=0,prev=null; keys.forEach(k=>{ if(prev&&todayKey(addDays(fromKey(prev),1))===k) run++; else run=1; best=Math.max(best,run); prev=k; }); return best; }
let gymMonth=todayKey();
function gymTags(arr){ return (arr||[]).map(m=>`<span class="gtag">${ABBR[m]||esc(m)}</span>`).join(''); }
function viewGym(){
  const tk=todayKey(), loggedToday=!!state.gym[tk], streak=gymStreak(), longest=gymLongest();
  const thisMonth=Object.keys(state.gym).filter(k=>state.gym[k]&&k.slice(0,7)===tk.slice(0,7)).length;
  const todayLabel = loggedToday ? '✓ Today: '+state.gym[tk].join(', ')+' — tap to edit' : 'Log workout (+'+GYM_POINTS+' coins)';
  // month calendar with muscle groups written on each logged day
  const anc=fromKey(gymMonth), y=anc.getFullYear(), m=anc.getMonth();
  const first=new Date(y,m,1), pad=first.getDay(), dim=new Date(y,m+1,0).getDate(), cells=[];
  for(let i=0;i<pad;i++) cells.push(null);
  for(let d=1;d<=dim;d++) cells.push(new Date(y,m,d));
  while(cells.length%7!==0) cells.push(null);
  const grid = DOW.map(d=>`<div class="gm-h">${d[0]}</div>`).join('') + cells.map(d=>{
    if(!d) return '<div class="gm-cell blank"></div>';
    const k=todayKey(d), arr=state.gym[k], on=arr&&arr.length, isT=k===tk;
    return `<button class="gm-cell ${on?'on':''} ${isT?'today':''}" data-act="gymDay" data-day="${k}"><span class="gm-num">${d.getDate()}</span>${on?`<span class="gm-tags">${gymTags(arr)}</span>`:''}</button>`;
  }).join('');
  return `<div class="app-pad">
    <div class="greeting">Gym Streak</div><div class="subtle">Tap the button for today, or any day to log the muscle groups you hit.</div>
    <div style="height:14px"></div>
    <div class="card"><div class="streak-hero"><div class="streak-num">${streak}</div><div class="streak-lbl">day streak${streak===0?' — start one today':''}</div></div>
      <button class="btn block ${loggedToday?'ghost':''}" data-act="logGym" style="margin-top:8px">${esc(todayLabel)}</button></div>
    <div class="stat-grid" style="margin-bottom:14px"><div class="stat"><div class="n">${longest}</div><div class="l">Longest streak</div></div><div class="stat"><div class="n">${thisMonth}</div><div class="l">Sessions this month</div></div></div>
    <div class="cal-nav"><button data-act="gymPrev" aria-label="Previous month"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="lbl">${MON[m]} ${y}</div>
      <button data-act="gymNext" aria-label="Next month"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button></div>
    <div class="card"><div class="gm-grid">${grid}</div></div>
  </div>`;
}

/* ---------- GARDEN (sequential shop + collection) ---------- */
function viewGarden(){
  const owned=state.garden, n=owned.length, bal=balance(), next=nextPlant();
  const scene = n
    ? owned.map(id=>{ const it=GARDEN.find(g=>g.id===id); return it?`<span class="g-item" title="${esc(it.nm)}">${it.e}</span>`:''; }).join('')
    : '<div class="garden-empty">Your garden is bare. Earn coins by getting things done, then plant your first piece below. 🌱</div>';
  const pct=Math.round(n/GARDEN.length*100);
  const shop=GARDEN.map((it,i)=>{
    const has=i<n, isNext=i===n, afford=bal>=PLANT_PRICE;
    let cls='shop-item', btn='';
    if(has){ cls+=' ownedcard'; btn='<button class="buy-btn owned" disabled>✓ Planted</button>'; }
    else if(isNext){ cls+=' next';
      btn = afford ? `<button class="buy-btn" data-act="buy" data-id="${it.id}">Plant · ${PLANT_PRICE}</button>`
                   : `<button class="buy-btn cant" disabled>Need ${PLANT_PRICE-bal} more</button>`;
    } else { cls+=' locked'; btn='<button class="buy-btn locked" disabled>🔒 Locked</button>'; }
    const emoji = has||isNext ? it.e : it.e; // shown faded via .locked opacity
    return `<div class="${cls}"><div class="emoji">${emoji}</div><div class="nm">${it.nm}</div><span class="rar ${it.r}">${RAR[it.r].label}</span><div class="price">${coinIco()} ${PLANT_PRICE}</div>${btn}</div>`;
  }).join('');
  const nextLine = next
    ? `Next: <b>${next.nm} ${next.e}</b> · ${Math.max(0,PLANT_PRICE-bal)>0?(PLANT_PRICE-bal)+' coins to go':'ready to plant!'}`
    : 'Every plant collected — you are a Garden Master 🗻';
  return `<div class="app-pad">
    <div class="greeting">Zen Garden</div><div class="subtle">Unlocked one step at a time. Stay consistent to reach the rare ones.</div>
    <div style="height:14px"></div>
    <div class="garden-scene">${scene}</div>
    <div class="collect-meter"><span>${n}/${GARDEN.length} planted</span><div class="bar"><i style="width:${Math.max(3,pct)}%"></i></div><span>${pct}%</span></div>
    <div class="card" style="background:linear-gradient(135deg,#C99A3F,#B3862B);color:#fff;border:none"><div style="display:flex;align-items:center;justify-content:space-between"><div><div style="font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:1px">Your wallet</div><div style="font-family:var(--serif);font-size:28px;font-weight:700">${bal} coins</div><div style="font-size:12.5px;opacity:.92;margin-top:2px">${nextLine}</div></div><div style="font-size:38px">🪙</div></div></div>
    <h2 style="font-size:13px;text-transform:uppercase;letter-spacing:1.3px;color:var(--text-soft);margin:4px 4px 12px">The Path — plant in order</h2>
    <div class="shop-grid">${shop}</div>

}

/* ---------- Focus timer ---------- */
function workSecs(){ return Math.max(1,state.focusSettings.work)*60; }
function breakSecs(){ return Math.max(1,state.focusSettings.brk)*60; }
const focus={ mode:'work', remaining:25*60, running:false, label:'', total:25*60 };
let focusInt=null;
function ringOffset(){ const c=2*Math.PI*86; return c*(1-focus.remaining/focus.total); }
function fmtClock(s){ const m=Math.floor(s/60),ss=s%60; return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`; }
function timerTick(){
  focus.remaining--;
  if(focus.remaining<=0){ clearInterval(focusInt); focusInt=null; focus.running=false;
    if(focus.mode==='work'){ state.focusSessions++; award(FOCUS_BONUS,window.innerWidth/2,120); confetti(); toast('Focus session complete! +'+FOCUS_BONUS+' coins'); focus.mode='break'; focus.total=breakSecs(); focus.remaining=breakSecs(); }
    else { toast('Break over — back to it.'); focus.mode='work'; focus.total=workSecs(); focus.remaining=workSecs(); }
    Store.save();
  }
  updateTimerUI();
}
function updateTimerUI(){ const t=document.getElementById('timerT'); if(t)t.textContent=fmtClock(focus.remaining); const r=document.getElementById('ringProg'); if(r)r.setAttribute('stroke-dashoffset',ringOffset()); const me=document.querySelector('.timer-time .mode'); if(me)me.textContent=focus.mode==='work'?'Focus':'Break'; }

/* ---------- Sheet ---------- */
function openSheet(html){ document.getElementById('sheet').innerHTML=html; document.getElementById('overlay').classList.add('show'); }
function closeSheet(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeSheet(); });
function scheduleSheet(taskId, presetTitle){
  const t=taskId?state.tasks.find(x=>x.id===taskId):null;
  const title = presetTitle!=null ? presetTitle : (t?t.title:'');
  const heading = presetTitle!=null ? 'Schedule subtask' : (t?'Schedule task':'New time block');
  openSheet(`<h3>${heading}</h3>
    <div class="field"><label>Title</label><input id="blkTitle" type="text" value="${esc(title)}" placeholder="What's the block for?" /></div>
    <div class="field"><label>Day</label><input id="blkDay" type="date" value="${selectedDay}" /></div>
    <div class="row2"><div class="field"><label>Start</label><input id="blkStart" type="time" value="09:00" /></div><div class="field"><label>End</label><input id="blkEnd" type="time" value="10:00" /></div></div>
    <button class="btn block" data-act="saveBlock" data-task="${taskId||''}">Add to calendar</button>
    <button class="btn ghost block" data-act="closeSheet" style="margin-top:8px">Cancel</button>`);
}
function saveBlock(taskId){
  const title=document.getElementById('blkTitle').value.trim(), day=document.getElementById('blkDay').value, st=document.getElementById('blkStart').value, en=document.getElementById('blkEnd').value;
  if(!title||!day||!st||!en){ toast('Fill in all fields'); return; }
  const toMin=v=>{ const [h,m]=v.split(':').map(Number); return h*60+m; };
  let s=toMin(st),e=toMin(en); if(e<=s) e=s+30;
  state.blocks.push({id:uid(),title,day,start:s,end:e,taskId:taskId||null}); Store.save(); closeSheet();
  selectedDay=day; calView='week'; if(currentTab!=='calendar') setTab('calendar'); else render(); toast('Time block added');
}

/* ---------- Wire ---------- */
function wire(){
  if(focus.running && !focusInt) focusInt=setInterval(timerTick,1000);
  document.getElementById('view').onclick=(e)=>{
    const btn=e.target.closest('[data-act]'); if(!btn) return;
    const act=btn.dataset.act,id=btn.dataset.id,rect=btn.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top;
    if(act==='toggle') toggleTask(id,cx,cy);
    else if(act==='del'){ state.tasks=state.tasks.filter(t=>t.id!==id); expandedTasks.delete(id); Store.save(); render(); }
    else if(act==='schedule') scheduleSheet(id);
    else if(act==='expand') toggleExpand(id);
    else if(act==='editTask') openEditTask(id);
    else if(act==='addSub') addSubtaskFromInput(id);
    else if(act==='toggleSub') toggleSub(id, btn.dataset.sub);
    else if(act==='editSub') openEditSub(id, btn.dataset.sub);
    else if(act==='scheduleSub'){ const t=state.tasks.find(x=>x.id===id); const s=t&&(t.subtasks||[]).find(x=>x.id===btn.dataset.sub); if(s) scheduleSheet(id, s.title); }
    else if(act==='delSub') delSubtask(id, btn.dataset.sub);
    else if(act==='moveTask') moveTask(id, btn.dataset.dir);
    else if(act==='moveSub') moveSub(id, btn.dataset.sub, btn.dataset.dir);
    else if(act==='toggleReorder'){ reorderMode=!reorderMode; render(); }
    else if(act==='prio'){ const v=document.getElementById('newTask')?.value||''; draftPrio=btn.dataset.p; render(); const n=document.getElementById('newTask'); if(n) n.value=v; }
    else if(act==='cat'){ const v=document.getElementById('newTask')?.value||''; draftCat=btn.dataset.c; render(); const n=document.getElementById('newTask'); if(n) n.value=v; }
    else if(act==='addTask') addTaskFromInput();
    else if(act==='pickday'){ selectedDay=btn.dataset.day; render(); }
    else if(act==='pickmonthday'){ selectedDay=btn.dataset.day; calView='week'; render(); }
    else if(act==='addBlock') scheduleSheet(null);
    else if(act==='delblock'){ state.blocks=state.blocks.filter(b=>b.id!==id); Store.save(); render(); }
    else if(act==='logGym') openGymSheet(todayKey());
    else if(act==='gymDay') openGymSheet(btn.dataset.day);
    else if(act==='gymPrev'){ const d=fromKey(gymMonth); gymMonth=todayKey(new Date(d.getFullYear(),d.getMonth()-1,1)); render(); }
    else if(act==='gymNext'){ const d=fromKey(gymMonth); gymMonth=todayKey(new Date(d.getFullYear(),d.getMonth()+1,1)); render(); }
    else if(act==='editObt') editObt();
    else if(act==='timerToggle') toggleTimer();
    else if(act==='timerReset') resetTimer();
    else if(act==='saveFocus') saveFocusSettings();
    else if(act==='buy') buyItem(id);
    else if(act==='calWeek'){ calView='week'; render(); }
    else if(act==='calMonth'){ calView='month'; monthAnchor=selectedDay; render(); }
    else if(act==='prevWeek'){ selectedDay=todayKey(addDays(fromKey(selectedDay),-7)); render(); }
    else if(act==='nextWeek'){ selectedDay=todayKey(addDays(fromKey(selectedDay),7)); render(); }
    else if(act==='prevMonth'){ const d=fromKey(monthAnchor); monthAnchor=todayKey(new Date(d.getFullYear(),d.getMonth()-1,1)); render(); }
    else if(act==='nextMonth'){ const d=fromKey(monthAnchor); monthAnchor=todayKey(new Date(d.getFullYear(),d.getMonth()+1,1)); render(); }
  };
  const nt=document.getElementById('newTask'); if(nt) nt.addEventListener('keydown',e=>{ if(e.key==='Enter') addTaskFromInput(); });
  document.querySelectorAll('input[id^="subin-"]').forEach(inp=>inp.addEventListener('keydown',e=>{ if(e.key==='Enter') addSubtaskFromInput(inp.id.slice(6)); }));
  const fl=document.getElementById('focusLabel'); if(fl) fl.addEventListener('input',e=>{ focus.label=e.target.value; });
  document.getElementById('sheet').onclick=(e)=>{
    const btn=e.target.closest('[data-act]'); if(!btn) return; const a=btn.dataset.act;
    if(a==='saveBlock') saveBlock(btn.dataset.task||null);
    else if(a==='closeSheet') closeSheet();
    else if(a==='saveObt'){ state.oneBigThing=(document.getElementById('obtInput').value||'').trim(); Store.save(); closeSheet(); render(); }
    else if(a==='saveEditTask') saveEditTask(btn.dataset.id);
    else if(a==='saveEditSub') saveEditSub(btn.dataset.id, btn.dataset.sub);
    else if(a==='toggleMuscle') toggleMuscle(btn.dataset.m);
    else if(a==='saveGym') saveGym();
    else if(a==='removeGymDay') removeGymDay();
    else if(a==='wipe'){ state=defaultState(); Store.save(); closeSheet(); setTab('today'); toast('Data reset'); }
    else if(a==='openSync') openSyncSheet();
    else if(a==='saveFbConfig') saveFbConfig();
    else if(a==='changeConfig') changeConfig();
    else if(a==='clearFbConfig') clearFbConfig();
    else if(a==='syncSignUp') syncSignUp();
    else if(a==='syncSignIn') syncSignIn();
    else if(a==='syncSignOut') syncSignOut();
  };
}
function addTaskFromInput(){ const inp=document.getElementById('newTask'); if(!inp) return; const title=inp.value.trim(); if(!title) return; state.tasks.unshift({id:uid(),title,prio:draftPrio,category:draftCat,done:false,subtasks:[],created:Date.now()}); Store.save(); render(); toast(draftCat+' task added'); }

/* ---- subtasks (no coins for these) ---- */
function toggleExpand(id){ if(expandedTasks.has(id)) expandedTasks.delete(id); else expandedTasks.add(id); render(); const inp=document.getElementById('subin-'+id); if(inp) inp.focus(); }
function addSubtaskFromInput(taskId){ const t=state.tasks.find(x=>x.id===taskId); const inp=document.getElementById('subin-'+taskId); if(!t||!inp) return; const title=inp.value.trim(); if(!title) return; if(!t.subtasks) t.subtasks=[]; t.subtasks.push({id:uid(),title,done:false}); expandedTasks.add(taskId); Store.save(); render(); const ni=document.getElementById('subin-'+taskId); if(ni) ni.focus(); }
function toggleSub(taskId,subId){ const t=state.tasks.find(x=>x.id===taskId); if(!t) return; const s=(t.subtasks||[]).find(x=>x.id===subId); if(!s) return; s.done=!s.done; Store.save(); render(); }
function moveTask(id,dir){
  const open=state.tasks.filter(x=>!x.done); const oi=open.findIndex(x=>x.id===id); if(oi<0) return;
  const tgt=dir==='up'?oi-1:oi+1; if(tgt<0||tgt>=open.length) return;
  const ia=state.tasks.indexOf(open[oi]), ib=state.tasks.indexOf(open[tgt]);
  [state.tasks[ia],state.tasks[ib]]=[state.tasks[ib],state.tasks[ia]]; Store.save(); render();
}
function moveSub(taskId,subId,dir){
  const t=state.tasks.find(x=>x.id===taskId); if(!t||!t.subtasks) return;
  const i=t.subtasks.findIndex(s=>s.id===subId); if(i<0) return;
  const tgt=dir==='up'?i-1:i+1; if(tgt<0||tgt>=t.subtasks.length) return;
  [t.subtasks[i],t.subtasks[tgt]]=[t.subtasks[tgt],t.subtasks[i]]; Store.save(); render();
}
function delSubtask(taskId,subId){ const t=state.tasks.find(x=>x.id===taskId); if(!t) return; t.subtasks=(t.subtasks||[]).filter(x=>x.id!==subId); Store.save(); render(); }
function openEditTask(id){ const t=state.tasks.find(x=>x.id===id); if(!t) return;
  const catOpts=Object.keys(CATEGORIES).map(c=>`<option value="${c}" ${t.category===c?'selected':''}>${c}</option>`).join('');
  const prioOpts=Object.keys(PRIORITY).map(p=>`<option value="${p}" ${t.prio===p?'selected':''}>${PRIORITY[p].label} · ${PRIORITY[p].points}</option>`).join('');
  openSheet(`<h3>Edit task</h3>
    <div class="field"><label>Task</label><input id="etTitle" type="text" value="${esc(t.title)}" /></div>
    <div class="row2"><div class="field"><label>Category</label><select id="etCat">${catOpts}</select></div>
      <div class="field"><label>Priority</label><select id="etPrio">${prioOpts}</select></div></div>
    <button class="btn block" data-act="saveEditTask" data-id="${id}">Save changes</button>
    <button class="btn ghost block" data-act="closeSheet" style="margin-top:8px">Cancel</button>`);
  setTimeout(()=>document.getElementById('etTitle')?.focus(),250);
}
function saveEditTask(id){ const t=state.tasks.find(x=>x.id===id); if(!t) return; const title=(document.getElementById('etTitle').value||'').trim(); if(!title){ toast('Task needs a title'); return; } t.title=title; t.category=document.getElementById('etCat').value; t.prio=document.getElementById('etPrio').value; Store.save(); closeSheet(); render(); toast('Task updated'); }
function openEditSub(taskId,subId){ const t=state.tasks.find(x=>x.id===taskId); const s=t&&(t.subtasks||[]).find(x=>x.id===subId); if(!s) return;
  openSheet(`<h3>Edit subtask</h3><div class="field"><label>Subtask</label><input id="esTitle" type="text" value="${esc(s.title)}" /></div>
    <button class="btn block" data-act="saveEditSub" data-id="${taskId}" data-sub="${subId}">Save</button>
    <button class="btn ghost block" data-act="closeSheet" style="margin-top:8px">Cancel</button>`);
  setTimeout(()=>document.getElementById('esTitle')?.focus(),250);
}
function saveEditSub(taskId,subId){ const t=state.tasks.find(x=>x.id===taskId); const s=t&&(t.subtasks||[]).find(x=>x.id===subId); if(!s) return; const title=(document.getElementById('esTitle').value||'').trim(); if(!title){ toast('Subtask needs a title'); return; } s.title=title; Store.save(); closeSheet(); render(); toast('Subtask updated'); }
function toggleTask(id,cx,cy){ const t=state.tasks.find(x=>x.id===id); if(!t) return; t.done=!t.done;
  if(t.done){ t.doneAt=Date.now(); const pts=PRIORITY[t.prio].points; award(pts,cx,cy); toast('+'+pts+' coins · '+PRIORITY[t.prio].label+' task done'); }
  else { t.doneAt=null; state.coins.earned=Math.max(state.coins.spent, state.coins.earned-PRIORITY[t.prio].points); }
  Store.save(); setTimeout(render,260);
}
let gymDraftDay=null, gymDraftGroups=[];
function openGymSheet(dayKey){
  gymDraftDay = dayKey || todayKey();
  gymDraftGroups = (state.gym[gymDraftDay]||[]).slice();
  renderGymSheet();
}
function renderGymSheet(){
  const d=fromKey(gymDraftDay), had=state.gym[gymDraftDay]&&state.gym[gymDraftDay].length;
  const label = gymDraftDay===todayKey() ? 'today' : `${DOW[d.getDay()]}, ${MON[d.getMonth()].slice(0,3)} ${d.getDate()}`;
  const chips=MUSCLES.map(m=>`<button class="mchip ${gymDraftGroups.includes(m)?'on':''}" data-act="toggleMuscle" data-m="${m}">${m}</button>`).join('');
  openSheet(`<h3>Muscle groups — ${esc(label)}</h3>
    <div class="subtle" style="margin:-8px 0 12px">Select all you did (tap to toggle).</div>
    <div class="mchips">${chips}</div>
    <button class="btn block" data-act="saveGym">${gymDraftGroups.length?'Save '+gymDraftGroups.length+' group'+(gymDraftGroups.length>1?'s':''):'Save'}</button>
    ${had?'<button class="btn block" data-act="removeGymDay" style="background:var(--high);margin-top:8px">Remove this day</button>':''}
    <button class="btn ghost block" data-act="closeSheet" style="margin-top:8px">Cancel</button>`);
}
function toggleMuscle(m){ const i=gymDraftGroups.indexOf(m); if(i>=0) gymDraftGroups.splice(i,1); else gymDraftGroups.push(m); renderGymSheet(); }
function saveGym(){
  const day=gymDraftDay, wasLogged=state.gym[day]&&state.gym[day].length;
  if(gymDraftGroups.length===0){
    if(wasLogged){ delete state.gym[day]; state.coins.earned=Math.max(state.coins.spent, state.coins.earned-GYM_POINTS); toast('Log removed'); }
  } else {
    state.gym[day]=gymDraftGroups.slice();
    if(!wasLogged){ award(GYM_POINTS, window.innerWidth/2, 140); toast('Logged: '+gymDraftGroups.join(', ')+' · +'+GYM_POINTS+' coins'); }
    else toast('Updated: '+gymDraftGroups.join(', '));
  }
  Store.save(); closeSheet(); render();
}
function removeGymDay(){
  const day=gymDraftDay;
  if(state.gym[day]){ delete state.gym[day]; state.coins.earned=Math.max(state.coins.spent, state.coins.earned-GYM_POINTS); }
  Store.save(); closeSheet(); render(); toast('Log removed');
}
function editObt(){
  openSheet(`<h3>Your One Big Win</h3><div class="field"><label>The single win that matters most today</label><input id="obtInput" type="text" value="${esc(state.oneBigThing)}" placeholder="e.g. Finish the essay draft" /></div><button class="btn block" data-act="saveObt">Save</button>`);
  setTimeout(()=>document.getElementById('obtInput')?.focus(),250);
}
function buyItem(id){
  const next=nextPlant();
  if(!next || next.id!==id){ toast('Plant them in order — earn this one first'); return; }
  if(balance()<PLANT_PRICE){ toast('Need '+(PLANT_PRICE-balance())+' more coins'); return; }
  state.coins.spent+=PLANT_PRICE; state.garden.push(id); Store.save(); confetti();
  const after=nextPlant();
  toast('Planted '+next.nm+'! '+next.e+(after?'':' — Garden complete! 🗻'));
  render();
}
function toggleTimer(){ focus.running=!focus.running; if(focus.running) focusInt=setInterval(timerTick,1000); else { clearInterval(focusInt); focusInt=null; } const b=document.querySelector('[data-act=timerToggle]'); if(b) b.textContent=focus.running?'Pause':'Start'; }
function resetTimer(){ clearInterval(focusInt); focusInt=null; focus.running=false; focus.mode='work'; focus.total=workSecs(); focus.remaining=workSecs(); updateTimerUI(); const b=document.querySelector('[data-act=timerToggle]'); if(b) b.textContent='Start'; }
function saveFocusSettings(){
  const w=parseInt(document.getElementById('workMin').value,10), r=parseInt(document.getElementById('brkMin').value,10);
  if(!w||w<1||!r||r<1){ toast('Enter valid minutes'); return; }
  state.focusSettings.work=Math.min(180,w); state.focusSettings.brk=Math.min(60,r); Store.save();
  if(!focus.running){ focus.mode='work'; focus.total=workSecs(); focus.remaining=workSecs(); }
  toast('Saved: '+state.focusSettings.work+' min focus / '+state.focusSettings.brk+' min rest'); render();
}

/* ---------- Menu ---------- */
document.getElementById('resetBtn').addEventListener('click',()=>{
  openSheet(`<h3>Options</h3>
    <button class="btn block" data-act="openSync" style="margin-bottom:10px">☁ Cloud sync${syncActive()?' · on':''}</button>
    <button class="btn ghost block" data-act="closeSheet" style="margin-bottom:10px">Close</button>
    <button class="btn block" data-act="wipe" style="background:var(--high)">Reset all data</button>`);
});

/* ---------- Cloud Sync (Firebase, optional) ---------- */
const FB_KEY='lockedin.fbconfig';
// Baked-in Firebase project config (public by design; security is enforced by Firestore rules + Auth).
const FB_HARDCODED = {
  apiKey: "AIzaSyAS2XJ2JOpsxUVJCdtbgNrw3P4T7ZnlQ6M",
  authDomain: "locked-in-a9e2c.firebaseapp.com",
  projectId: "locked-in-a9e2c",
  storageBucket: "locked-in-a9e2c.firebasestorage.app",
  messagingSenderId: "505948336107",
  appId: "1:505948336107:web:02c9b19c3fad6f2d9cf3ae",
  measurementId: "G-RMWHX0GR2L"
};
let fbApp=null, fbAuth=null, fbDb=null, fbUser=null, fbUnsub=null, applyingRemote=false, pushTimer=null, forceConfigEntry=false;
function fbConfig(){ try{ const ls=JSON.parse(localStorage.getItem(FB_KEY)||'null'); if(ls) return ls; }catch(e){} return FB_HARDCODED; }
function syncActive(){ return !!(fbUser && fbDb); }
function initFirebase(){
  const cfg=fbConfig();
  if(!cfg || typeof firebase==='undefined') return false;
  try{
    if(!fbApp){
      fbApp=firebase.initializeApp(cfg); fbAuth=firebase.auth(); fbDb=firebase.firestore();
      fbAuth.onAuthStateChanged(u=>{ fbUser=u; if(u) attachDoc(); else detachDoc(); updateSyncUI(); });
    }
    return true;
  }catch(e){ console.warn('firebase init failed',e); return false; }
}
function attachDoc(){
  if(!fbUser||!fbDb) return; detachDoc();
  const ref=fbDb.collection('lockedin').doc(fbUser.uid);
  fbUnsub=ref.onSnapshot(snap=>{
    const data=snap.data();
    if(!data){ pushNow(); return; }              // first run for this account → seed with local
    if(!data.state) return;
    const rts=data._ts||0, lts=state._ts||0;
    if(rts===lts) return;                          // echo of our own write
    if(rts>lts) applyRemote(data.state, rts); else pushNow();
  }, err=>console.warn('snapshot error',err));
}
function detachDoc(){ if(fbUnsub){ try{fbUnsub();}catch(e){} fbUnsub=null; } }
function applyRemote(remote, rts){
  applyingRemote=true;
  state=normalize(remote); state._ts=rts;
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  render(); applyingRemote=false; toast('Updated from your other device');
}
function pushDebounced(){ if(!syncActive()) return; clearTimeout(pushTimer); pushTimer=setTimeout(pushNow,700); }
function pushNow(){
  if(!syncActive()) return;
  fbDb.collection('lockedin').doc(fbUser.uid).set({ state, _ts: state._ts||Date.now(), email: fbUser.email||'' })
    .catch(e=>console.warn('push failed',e));
}
function updateSyncUI(){ const h=document.querySelector('#sheet h3'); if(h && h.textContent==='Cloud Sync' && document.getElementById('overlay').classList.contains('show')) openSyncSheet(); }

function openSyncSheet(){
  const cfg=fbConfig(); const ready=(typeof firebase!=='undefined');
  let body='';
  if(!ready) body+=`<div class="subtle" style="margin-bottom:12px">Sync only runs on your hosted site with internet — not in this in-chat preview.</div>`;
  if(forceConfigEntry || !cfg){
    body+=`<div class="subtle" style="margin-bottom:12px">Paste your Firebase config to connect this device.</div>
      <div class="field"><label>Firebase config</label><textarea id="fbCfg" rows="7" placeholder="const firebaseConfig = { apiKey: ... }" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);font-size:12.5px;font-family:monospace;outline:none"></textarea></div>
      <button class="btn block" data-act="saveFbConfig">Connect</button>`;
  } else if(!fbUser){
    body+=`<div class="subtle" style="margin-bottom:12px">Sign in with the <b>same email</b> on every device to share your data.</div>
      <div class="field"><label>Email</label><input id="syncEmail" type="email" autocomplete="username" placeholder="you@email.com" /></div>
      <div class="field"><label>Password</label><input id="syncPass" type="password" autocomplete="current-password" placeholder="6+ characters" /></div>
      <button class="btn block" data-act="syncSignIn">Sign in</button>
      <button class="btn ghost block" data-act="syncSignUp" style="margin-top:8px">Create account (first time)</button>
      <button class="btn ghost block" data-act="changeConfig" style="margin-top:8px;font-size:13px">Change config</button>`;
  } else {
    body+=`<div class="subtle" style="margin-bottom:12px">✓ Syncing live as <b>${esc(fbUser.email||'account')}</b>. Changes appear on every device signed in with this account.</div>
      <button class="btn ghost block" data-act="syncSignOut">Sign out on this device</button>`;
  }
  openSheet(`<h3>Cloud Sync</h3>${body}<button class="btn ghost block" data-act="closeSheet" style="margin-top:8px">Close</button>`);
}
function saveFbConfig(){
  let raw=(document.getElementById('fbCfg').value||'').trim();
  raw=raw.replace(/^\s*(const|let|var)\s+\w+\s*=\s*/,'').replace(/;\s*$/,'').trim();
  let cfg=null;
  try{ cfg=JSON.parse(raw); }catch(e){ try{ cfg=(new Function('return ('+raw+')'))(); }catch(e2){ toast('Could not read that config'); return; } }
  if(!cfg||!cfg.apiKey||!cfg.projectId){ toast('Config missing apiKey / projectId'); return; }
  localStorage.setItem(FB_KEY, JSON.stringify(cfg)); forceConfigEntry=false;
  if(initFirebase()){ toast('Connected'); openSyncSheet(); } else { toast('Could not start sync (need internet + hosting)'); }
}
function changeConfig(){ forceConfigEntry=true; openSyncSheet(); }
function clearFbConfig(){ localStorage.removeItem(FB_KEY); detachDoc(); if(fbAuth){ try{fbAuth.signOut();}catch(e){} } fbApp=fbAuth=fbDb=fbUser=null; openSyncSheet(); }
function syncSignUp(){ if(!fbAuth){toast('Connect config first');return;} const e=(document.getElementById('syncEmail').value||'').trim(), p=document.getElementById('syncPass').value||''; fbAuth.createUserWithEmailAndPassword(e,p).then(()=>toast('Account created — syncing')).catch(err=>toast(err.message||'Sign up failed')); }
function syncSignIn(){ if(!fbAuth){toast('Connect config first');return;} const e=(document.getElementById('syncEmail').value||'').trim(), p=document.getElementById('syncPass').value||''; fbAuth.signInWithEmailAndPassword(e,p).then(()=>toast('Signed in — syncing')).catch(err=>toast(err.message||'Sign in failed')); }
function syncSignOut(){ if(fbAuth) fbAuth.signOut().then(()=>{ toast('Signed out'); openSyncSheet(); }); }

/* ---------- Boot ---------- */
focus.total=workSecs(); focus.remaining=workSecs();
render();
window.addEventListener('load', ()=>{ initFirebase(); });
</script>
</body>
